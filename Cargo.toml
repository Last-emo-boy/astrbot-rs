[workspace]
members = [
    "crates/astrbot-agent",
    "crates/astrbot-conversation",
    "crates/astrbot-core",
    "crates/astrbot-kb",
    "crates/astrbot-mcp",
    "crates/astrbot-observability",
    "crates/astrbot-provider",
    "crates/astrbot-platform",
    "crates/astrbot-pipeline",
    "crates/astrbot-plugin",
    "crates/astrbot-render",
    "crates/astrbot-runtime",
    "crates/astrbot-storage",
    "crates/astrbot-tool",
    "crates/astrbot-web",
    "crates/astrbot-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
