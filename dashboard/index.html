<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstrBot RS Dashboard</title>
    <link rel="icon" type="image/webp" href="/assets/images/astrbot_logo_mini.webp" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" data-dashboard-sidebar>
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <div class="brand-title">AstrBot RS</div>
            <div class="brand-subtitle">Rust Dashboard</div>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1 id="page-title">总览</h1>
            <p id="page-subtitle">运行状态与核心业务入口</p>
          </div>
          <div class="topbar-actions">
            <button id="mobile-sidebar-toggle" class="button ghost icon mobile-sidebar-toggle" type="button" aria-label="Open navigation">☰</button>
            <label class="topbar-language" for="topbar-locale">
              <span class="sr-only">Language</span>
              <select id="topbar-locale"></select>
            </label>
            <span id="connection-state" class="status-pill">连接中</span>
            <button id="refresh-button" class="button secondary" type="button">刷新</button>
          </div>
        </header>

        <section id="toast" class="toast" hidden></section>
        <section id="content" class="content"></section>
      </main>
    </div>
    <button id="drawer-scrim" class="drawer-scrim" type="button" aria-label="Close navigation" hidden></button>

    <script type="module" src="/app.js"></script>
  </body>
</html>
